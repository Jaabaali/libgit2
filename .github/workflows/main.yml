name: CI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform:
        - name: Linux
          id: linux
          os: ubuntu-latest
          env:
            CC: gcc
            CMAKE_GENERATOR: Ninja
            CMAKE_OPTIONS: -DUSE_HTTPS=OpenSSL -DUSE_BUNDLED_ZLIB=ON -DDEPRECATE_HARD=ON
        - name: macOS
          id: macos
          os: macos-14
          env:
            CC: clang
            CMAKE_GENERATOR: Ninja
            CMAKE_OPTIONS: -DREGEX_BACKEND=builtin -DDEPRECATE_HARD=ON
        - name: Windows
          id: windows
          os: windows-2022
          env:
            CMAKE_GENERATOR: Visual Studio 17 2022
            CMAKE_OPTIONS: -A x64 -DUSE_SHA1=HTTPS -DUSE_BUNDLED_ZLIB=ON -DDEPRECATE_HARD=ON
    name: "Test: ${{ matrix.platform.name }}"
    runs-on: ${{ matrix.platform.os }}
    env:
      CC: ${{ matrix.platform.env.CC }}
      CMAKE_GENERATOR: ${{ matrix.platform.env.CMAKE_GENERATOR }}
      CMAKE_OPTIONS: ${{ matrix.platform.env.CMAKE_OPTIONS }}
      SKIP_ONLINE_TESTS: 1
      SKIP_GITDAEMON_TESTS: 1
      SKIP_PROXY_TESTS: 1
      SKIP_NTLM_TESTS: 1
      SKIP_NEGOTIATE_TESTS: 1
      SKIP_SSH_TESTS: 1
      SKIP_FUZZERS: 1
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cmake \
          gcc \
          git \
          libssl-dev \
          zlib1g-dev \
          make \
          ninja-build \
          pkgconf

    - name: Configure macOS environment
      if: runner.os == 'macOS'
      run: |
        echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

    - name: Export Windows build path
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        "BUILD_PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Prepare build directory
      run: mkdir build
      shell: bash

    - name: Build
      run: ../ci/build.sh
      working-directory: build
      shell: bash

    - name: Test
      run: ../ci/test.sh
      working-directory: build
      shell: bash

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: success() || failure()
      with:
        name: test-results-${{ matrix.platform.id }}
        path: build/results_*.xml

  test_results:
    name: Test results
    needs: [ test ]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Download test results
      uses: actions/download-artifact@v7
    - name: Generate test summary
      uses: test-summary/action@v2
      with:
        paths: 'test-results-*/*.xml'
